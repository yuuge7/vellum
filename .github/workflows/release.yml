# Every push to main: test, bump the version, build a signed APK and publish it
# as a GitHub release named "Vellum vX.Y" (tag vX.Y). The version bump is
# committed back to main, so pull before your next push.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64    base64 of vellum-release.jks
#   KEYSTORE_PASSWORD  storePassword from key.properties
#   KEY_ALIAS          keyAlias from key.properties
#   KEY_PASSWORD       keyPassword from key.properties
#
# Add [skip ci] to a commit message to push without releasing.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump
        type: choice
        options: [minor, major]
        default: minor

permissions:
  contents: write

# Releases run one at a time so two quick pushes never compute the same version.
concurrency:
  group: release
  cancel-in-progress: false

env:
  APP_NAME: Vellum
  FLUTTER_VERSION: 3.47.0

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set. See README, 'Release signing'."
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties

      - name: Bump version
        id: version
        run: |
          bash .github/scripts/bump-version.sh "${{ inputs.bump || 'minor' }}" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Commit version to main
        id: commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! git diff --quiet -- pubspec.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(release): $APP_NAME v$VERSION [skip ci]" -- pubspec.yaml
            pushed=false
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then pushed=true; break; fi
              git pull --rebase origin main
            done
            if [ "$pushed" != true ]; then
              echo "::error::Could not push the version bump to main"
              exit 1
            fi
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build signed APK
        env:
          REQUIRE_RELEASE_SIGNING: "true"
        run: flutter build apk --release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          apk="$APP_NAME-v$VERSION.apk"
          mv build/app/outputs/flutter-apk/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          gh release create "v$VERSION" "$apk" "$apk.sha256" \
            --target "$SHA" \
            --title "$APP_NAME v$VERSION" \
            --generate-notes \
            --latest

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" key.properties
